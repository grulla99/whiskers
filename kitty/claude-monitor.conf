# Claude Code 세션 모니터링 패널 — 현재 탭에 좌우 분할로 띄우기.
#
# panel kitten(항상 위 오버레이)이 아니라 kitty의 일반 split을 쓴다 — 터미널과
# "하나의 UI"로 합쳐지길 원해서 내린 결정 (.harness/kitty-claude-monitor/context.md 참조).
# enabled_layouts에 splits가 포함되어 있어야 진짜 분할로 동작한다(이미 설정돼 있음).
#
# 사용법: 이 파일을 ~/.config/kitty/kitty.conf 에 `include claude-monitor.conf`로
# 추가하거나, 아래 한 줄을 직접 옮겨 붙인다.
map cmd+m launch --location=vsplit --cwd=/Users/junho/dotfiles/claude-monitor /Users/junho/dotfiles/claude-monitor/.venv/bin/python -m claude_monitor.tui
