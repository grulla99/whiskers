# Claude Code 세션 모니터링 패널 — cmd+m으로 현재 탭에 토글(껐다 켰다).
#
# panel kitten(항상 위 오버레이)이 아니라 kitty의 일반 split을 쓴다 — 터미널과
# "하나의 UI"로 합쳐지길 원해서 내린 결정 (.harness/kitty-whiskers/context.md 참조).
# enabled_layouts에 splits가 포함되어 있어야 진짜 분할로 동작한다(이미 설정돼 있음).
#
# 토글 로직(이미 떠 있으면 닫고, 없으면 연다)은 원격제어 조회가 필요해 `map ... launch`
# 한 줄로는 안 되고 별도 스크립트(whiskers-toggle.sh)를 거친다.
#
# 사용법: ~/.config/kitty/kitty.conf 에서 이 파일을 include 한다.
#   include /Users/junho/whiskers/kitty/whiskers.conf

# cmd+0x2e 는 한글 입력 상태에서도 동작하도록 하는 macOS 네이티브 키코드(m) 변형
# — 기존 cmd+w(0xd) / cmd+e(0xe) 매핑과 같은 관례.
map cmd+m launch --type=background /Users/junho/whiskers/kitty/whiskers-toggle.sh
map cmd+0x2e launch --type=background /Users/junho/whiskers/kitty/whiskers-toggle.sh
