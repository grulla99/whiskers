# Whiskers 모니터 패널 — cmd+m 으로 현재 탭에 토글(껐다 켰다).
#
# panel kitten(항상 위 오버레이)이 아니라 kitty 의 일반 split 을 쓴다 — 터미널과
# "하나의 UI"로 합쳐지도록 내린 결정. enabled_layouts 에 splits 가 있어야 분할로 동작한다.
#
# 토글 로직(이미 떠 있으면 닫고, 없으면 연다)은 원격제어 조회가 필요해
# `map ... launch` 한 줄로는 안 되고 별도 스크립트(whiskers-toggle.sh)를 거친다.
#
# 이 파일은 kitty.conf 에서 `include whiskers.conf` 로 불린다 (install.sh 가 배치).
#
# kitty 는 conf 에서 $HOME 을 확장하지 않으므로 sh -c 로 감싸 쉘이 확장하게 한다.
# cmd+0x2e 는 한글 입력 상태에서도 먹도록 하는 macOS 네이티브 키코드(m) 변형
# — 기존 cmd+w(0xd) / cmd+e(0xe) 매핑과 같은 관례.
map cmd+m launch --type=background sh -c "$HOME/.config/kitty/scripts/whiskers-toggle.sh"
map cmd+0x2e launch --type=background sh -c "$HOME/.config/kitty/scripts/whiskers-toggle.sh"
